version: '3.8'

services:
  postgres:
    image: postgres:15.5-alpine
    container_name: cashflow_db
    environment:
      POSTGRES_DB: cashflow_db
      POSTGRES_USER: cashflow_user
      POSTGRES_PASSWORD: cashflow_password  # pragma: allowlist secret
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      TZ: Asia/Makassar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow_user -d cashflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cashflow_network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashflow_bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MANAGEMENT_CHAT_ID: ${MANAGEMENT_CHAT_ID}
      DATABASE_URL: postgresql://cashflow_user:cashflow_password@postgres:5432/cashflow_db  # pragma: allowlist secret
      TIMEZONE: Asia/Makassar
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    networks:
      - cashflow_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  cashflow_network:
    driver: bridge
