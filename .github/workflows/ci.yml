name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, '001-cashflow-bot' ]
    paths:
      - 'cashflow-bot/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'cashflow-bot/**'

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cashflow-bot

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cashflow-bot/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pylint
        run: |
          pylint src/ --fail-under=8.0

      - name: Run flake8
        run: |
          flake8 src/ --max-line-length=100 --max-complexity=15

      - name: Check code formatting with black
        run: |
          black --check src/ tests/

      - name: Check import sorting with isort
        run: |
          isort --check-only src/ tests/

      - name: Type checking with mypy
        run: |
          mypy src/ --ignore-missing-imports
        continue-on-error: true  # Type checking optional initially

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cashflow-bot

    services:
      postgres:
        image: postgres:15.5-alpine
        env:
          POSTGRES_DB: cashflow_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cashflow-bot/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cashflow_test_db
        run: |
          alembic upgrade head

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cashflow_test_db
          TELEGRAM_BOT_TOKEN: test_token_for_ci
          MANAGEMENT_CHAT_ID: 123456789
          TIMEZONE: Asia/Makassar
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/cashflow_test_db
          TELEGRAM_BOT_TOKEN: test_token_for_ci
          MANAGEMENT_CHAT_ID: 123456789
          TIMEZONE: Asia/Makassar
        run: |
          pytest tests/integration/ -v --cov=src --cov-append --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: cashflow-bot/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Coverage Gate
        run: |
          coverage report --fail-under=80

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cashflow-bot

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Check for known vulnerabilities
        run: |
          safety check -r requirements.txt
        continue-on-error: true  # Don't fail on advisory warnings

      - name: Run Bandit security linter
        run: |
          bandit -r src/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: cashflow-bot/bandit-report.json

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cashflow-bot
          file: ./cashflow-bot/Dockerfile
          push: false
          tags: cashflow-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm cashflow-bot:${{ github.sha }} python -c "import src.main; print('Import successful')"
        working-directory: cashflow-bot
